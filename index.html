<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contained Scroll Animation</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3efe7;
      color: #1e2635;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .intro {
      width: min(100%, 70rem);
      margin-bottom: 1.25rem;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.7rem, 4vw, 3rem);
      letter-spacing: -0.06em;
    }

    .intro p {
      margin-top: 0.75rem;
      color: #5c6471;
    }

    .scroll-panel {
      width: min(100%, 70rem);
      height: min(68vh, 38rem);
      overflow-y: auto;
      border: 1px solid #d9d1c4;
      border-radius: 1.5rem;
      background: #fffdf9;
      box-shadow: 0 1.5rem 4rem rgb(44 35 23 / 12%);
      scroll-timeline-name: --panel-scroll;
      scroll-timeline-axis: block;
    }

    .scroll-space {
      min-height: 1900px;
      padding: 1rem;
    }

    .scene {
      position: sticky;
      top: 1rem;
      height: calc(100vh - 4rem);
      min-height: 28rem;
      max-height: 34rem;
      overflow: hidden;
      border-radius: 1rem;
      background: #e5e9ea;
      isolation: isolate;
    }

    .copy {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: clamp(1.5rem, 7vw, 5rem);
      width: min(42%, 25rem);
      transform: translateY(-50%);
      animation: copy-fade linear both;
      animation-timeline: --panel-scroll;
    }

    .eyebrow {
      display: block;
      margin-bottom: 0.8rem;
      color: #61707b;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .copy h2 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.8rem);
      line-height: 0.9;
      letter-spacing: -0.075em;
    }

    .copy p {
      max-width: 22rem;
      margin-top: 1.25rem;
      font-size: 1rem;
      line-height: 1.55;
    }

    .box {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 0;
      width: clamp(12rem, 29vw, 22rem);
      aspect-ratio: 1.15;
      border-radius: 0.9rem;
      transform: translate(115vw, -50%) rotate(-8deg);
      box-shadow: 0 1.25rem 2.25rem rgb(26 34 47 / 22%);
      animation: pass-left linear both;
      animation-timeline: --panel-scroll;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 1.1rem;
      border: 1px solid rgb(255 255 255 / 42%);
      border-radius: 0.45rem;
    }

    .box-one {
      background: #f06449;
      animation-range: 5% 34%;
    }

    .box-two {
      background: #4055c7;
      animation-range: 36% 65%;
    }

    .box-three {
      background: #1f8b79;
      animation-range: 67% 96%;
    }

    .hint {
      position: absolute;
      right: 1.5rem;
      bottom: 1.25rem;
      z-index: 3;
      color: #61707b;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes pass-left {
      to {
        transform: translate(-28rem, -50%) rotate(8deg);
      }
    }

    @keyframes copy-fade {
      0%, 8%, 35%, 39%, 66%, 70%, 100% {
        opacity: 1;
      }
      21%, 52%, 83% {
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 1rem;
      }

      .scroll-panel {
        height: 72vh;
        border-radius: 1rem;
      }

      .scroll-space {
        padding: 0.65rem;
      }

      .scene {
        top: 0.65rem;
        min-height: 25rem;
      }

      .copy {
        top: 36%;
        width: 72%;
        left: 1.5rem;
      }

      .hint {
        right: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .box,
      .copy {
        animation: none;
      }

      .box {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="intro">
    <h1>A scroll animation inside the page</h1>
    <p>Scroll the panel below. Its own scrollbar, not the page, controls the animation.</p>
  </header>

  <main class="scroll-panel" aria-label="Scroll-driven animation demo">
    <div class="scroll-space">
      <section class="scene">
        <div class="copy">
          <span class="eyebrow">Contained motion</span>
          <h2>Ideas move through the frame.</h2>
          <p>The message fades precisely as each colour block crosses over it, then returns for the next pass.</p>
        </div>
        <div class="box box-one" aria-hidden="true"></div>
        <div class="box box-two" aria-hidden="true"></div>
        <div class="box box-three" aria-hidden="true"></div>
        <span class="hint">Scroll inside</span>
      </section>
    </div>
  </main>
</body>
</html>
